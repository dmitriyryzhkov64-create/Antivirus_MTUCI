name: Windows CMake Build

on:
  push:
    branches: [ main, feature/service-rpc ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean build directory
        run: cmake -E remove_directory build

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntivirusMTUCI-Windows-x64
          path: |
            build/Release/AntivirusMTUCI.exe
            build/Release/AntivirusMTUCIService.exe