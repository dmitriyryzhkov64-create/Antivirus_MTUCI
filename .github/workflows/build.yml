name: Windows CMake MSI Build

on:
  push:
    branches: [ main, feature/service-rpc, feature/auth-license, feature/av-engine, feature/installer]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean build directory
        run: cmake -E remove_directory build

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build application
        run: cmake --build build --config Release

      - name: Prepare installer directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build\installer
          New-Item -ItemType Directory -Force -Path build\deps

      - name: Download VC++ Redistributable
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "build\deps\vc_redist.x64.exe"

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2


      - name: Build MSI
        shell: powershell
        run: |
          wix build installer\Product.wxs `
            -arch x64 `
            -d BuildDir="$(Resolve-Path build\Release)" `
            -o build\installer\AntivirusMTUCI.msi

      - name: Build bootstrapper with VC++ dependency
        shell: powershell
        run: |
          wix build installer\Bundle.wxs `
            -ext WixToolset.Bal.wixext `
            -arch x64 `
            -d DependenciesDir="$(Resolve-Path build\deps)" `
            -d MsiPath="$(Resolve-Path build\installer\AntivirusMTUCI.msi)" `
            -o build\installer\AntivirusMTUCISetup.exe

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntivirusMTUCI-Windows-x64
          path: |
            build/Release/AntivirusMTUCI.exe
            build/Release/AntivirusMTUCIService.exe

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntivirusMTUCI-MSI
          path: build/installer/AntivirusMTUCI.msi
